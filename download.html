<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Laporan User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-processing {
            background: #cce5ff;
            color: #004085;
        }
        
        .status-resolved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .report-card {
            border-left: 4px solid;
            transition: all 0.3s ease;
        }
        
        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .platform-badge {
            background: #6c757d;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        
        .modal-lg {
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="bi bi-flag-fill me-2"></i> Laporan User</h4>
                        <div>
                            <button class="btn btn-light btn-sm" onclick="refreshReports()">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                            <button class="btn btn-success btn-sm ms-2" onclick="exportToExcel()">
                                <i class="bi bi-download"></i> Export
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Filter Section -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <label class="form-label">Status</label>
                                <select id="filterStatus" class="form-select" onchange="filterReports()">
                                    <option value="all">Semua Status</option>
                                    <option value="pending">Pending</option>
                                    <option value="processing">Processing</option>
                                    <option value="resolved">Resolved</option>
                                    <option value="rejected">Rejected</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Platform</label>
                                <select id="filterPlatform" class="form-select" onchange="filterReports()">
                                    <option value="all">Semua Platform</option>
                                    <option value="ps2">PS2</option>
                                    <option value="switch">Switch</option>
                                    <option value="psp">PSP</option>
                                    <option value="android">Android</option>
                                    <option value="psvita">PS Vita</option>
                                    <option value="pc">PC</option>
                                    <option value="wii">Wii</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Tanggal Dari</label>
                                <input type="date" id="filterDateFrom" class="form-control" onchange="filterReports()">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Tanggal Sampai</label>
                                <input type="date" id="filterDateTo" class="form-control" onchange="filterReports()">
                            </div>
                        </div>
                        
                        <!-- Stats Cards -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="card text-white bg-warning">
                                    <div class="card-body">
                                        <h5 class="card-title" id="pendingCount">0</h5>
                                        <p class="card-text">Pending</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-white bg-info">
                                    <div class="card-body">
                                        <h5 class="card-title" id="processingCount">0</h5>
                                        <p class="card-text">Processing</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-white bg-success">
                                    <div class="card-body">
                                        <h5 class="card-title" id="resolvedCount">0</h5>
                                        <p class="card-text">Resolved</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-white bg-danger">
                                    <div class="card-body">
                                        <h5 class="card-title" id="rejectedCount">0</h5>
                                        <p class="card-text">Rejected</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Reports Table -->
                        <div class="table-responsive">
                            <table class="table table-hover" id="reportsTable">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Game</th>
                                        <th>Platform</th>
                                        <th>Format</th>
                                        <th>Reporter</th>
                                        <th>Status</th>
                                        <th>Tanggal</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="reportsBody">
                                    <tr>
                                        <td colspan="8" class="text-center">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Detail Laporan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailModalBody">
                    <!-- Detail akan diisi dengan JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <div id="actionButtons">
                        <!-- Action buttons akan diisi berdasarkan status -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Update Status Modal -->
    <div class="modal fade" id="updateStatusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title text-white">Update Status Laporan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="currentReportId">
                    <div class="mb-3">
                        <label class="form-label">Status Baru</label>
                        <select id="newStatus" class="form-select">
                            <option value="processing">Processing</option>
                            <option value="resolved">Resolved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Catatan Admin</label>
                        <textarea id="adminNotes" class="form-control" rows="3" 
                                  placeholder="Tambahkan catatan untuk reporter..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-warning" onclick="saveStatusUpdate()">Simpan</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const REPORT_API_URL = "https://script.google.com/macros/s/AKfycbyeG5Yl-8TPQVJJJRXIng8u6sfgPyM1bsfgcfdhMmw6zUYjpvJIR_mq_rYNMSBkhnJN/exec"; // URL Apps Script Anda
        let allReports = [];
        let currentReport = null;
        
        // Fungsi untuk load semua laporan
        async function loadReports() {
            try {
                const response = await fetch(REPORT_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: 'action=getReports'
                });
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const result = await response.json();
                if (result.status === 'success') {
                    allReports = result.data;
                    displayReports(allReports);
                    updateStats(allReports);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert('Gagal memuat laporan: ' + error.message);
            }
        }
        
        // Fungsi untuk menampilkan laporan di table
function displayReports(reports) {
    const tbody = document.getElementById('reportsBody');
    
    if (reports.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center text-muted">
                    Tidak ada laporan ditemukan
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = reports.map(report => {
        // FIX: Handle invalid dates
        let dateString = 'Invalid Date';
        try {
            if (report.timestamp) {
                const dateObj = new Date(report.timestamp);
                if (!isNaN(dateObj.getTime())) {
                    dateString = dateObj.toLocaleDateString('id-ID', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });
                } else {
                    // Fallback: try parsing string format
                    dateString = formatDateFromString(report.timestamp);
                }
            }
        } catch (e) {
            console.error('Date parsing error:', e);
            dateString = formatDateFromString(report.timestamp);
        }
        
        const statusClass = getStatusClass(report.status);
        
        return `
            <tr>
                <td><strong>${report.reportId}</strong></td>
                <td>${escapeHTML(report.gameName)}</td>
                <td><span class="platform-badge">${report.platform}</span></td>
                <td>${report.format}</td>
                <td>${escapeHTML(report.reporterName)}<br>
                    <small class="text-muted">${report.reporterId}</small>
                </td>
                <td><span class="status-badge ${statusClass}">${report.status}</span></td>
                <td>${dateString}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="viewReportDetail('${report.reportId}')">
                        <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-warning ms-1" onclick="openUpdateStatusModal('${report.reportId}')"
                            ${report.status === 'resolved' || report.status === 'rejected' ? 'disabled' : ''}>
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

// Helper function untuk format tanggal dari string
function formatDateFromString(dateStr) {
    if (!dateStr || dateStr.trim() === '') return 'No Date';
    
    try {
        // Coba berbagai format
        const formats = [
            // Format ISO
            () => new Date(dateStr),
            // Format dengan timestamp
            () => new Date(parseInt(dateStr)),
            // Format "DD/MM/YYYY HH:MM:SS"
            () => {
                const parts = dateStr.split(/[/ :]/);
                if (parts.length >= 3) {
                    return new Date(parts[2], parts[1] - 1, parts[0], 
                                   parts[3] || 0, parts[4] || 0, parts[5] || 0);
                }
                return new Date(dateStr);
            }
        ];
        
        for (const formatFn of formats) {
            try {
                const date = formatFn();
                if (!isNaN(date.getTime())) {
                    return date.toLocaleDateString('id-ID', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });
                }
            } catch (e) {
                continue;
            }
        }
        
        // Jika semua gagal, return string asli (dipotong)
        return dateStr.length > 10 ? dateStr.substring(0, 10) : dateStr;
    } catch (e) {
        return 'Invalid Date';
    }
}
        
        // Fungsi untuk filter laporan
        function filterReports() {
            const statusFilter = document.getElementById('filterStatus').value;
            const platformFilter = document.getElementById('filterPlatform').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            
            let filtered = allReports;
            
            if (statusFilter !== 'all') {
                filtered = filtered.filter(r => r.status === statusFilter);
            }
            
            if (platformFilter !== 'all') {
                filtered = filtered.filter(r => r.platform === platformFilter);
            }
            
            if (dateFrom) {
                const fromDate = new Date(dateFrom);
                filtered = filtered.filter(r => new Date(r.timestamp) >= fromDate);
            }
            
            if (dateTo) {
                const toDate = new Date(dateTo);
                toDate.setHours(23, 59, 59, 999);
                filtered = filtered.filter(r => new Date(r.timestamp) <= toDate);
            }
            
            displayReports(filtered);
        }
        
        // Fungsi untuk update statistik
        function updateStats(reports) {
            const pending = reports.filter(r => r.status === 'pending').length;
            const processing = reports.filter(r => r.status === 'processing').length;
            const resolved = reports.filter(r => r.status === 'resolved').length;
            const rejected = reports.filter(r => r.status === 'rejected').length;
            
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('processingCount').textContent = processing;
            document.getElementById('resolvedCount').textContent = resolved;
            document.getElementById('rejectedCount').textContent = rejected;
        }
        
        // Fungsi untuk view detail laporan
function viewReportDetail(reportId) {
    const report = allReports.find(r => r.reportId === reportId);
    if (!report) return;
    
    currentReport = report;
    
    // FIX: Handle date formatting
    let dateString = 'Invalid Date';
    try {
        if (report.timestamp) {
            const dateObj = new Date(report.timestamp);
            if (!isNaN(dateObj.getTime())) {
                dateString = dateObj.toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } else {
                dateString = formatDateFromString(report.timestamp);
            }
        }
    } catch (e) {
        dateString = formatDateFromString(report.timestamp);
    }
    
    // FIX: Handle screenshot URL
    let screenshotHtml = '';
    if (report.screenshotUrl && report.screenshotUrl.trim() !== '') {
        let screenshotUrl = report.screenshotUrl.trim();
        
        // Convert Google Drive view link to preview link
        if (screenshotUrl.includes('drive.google.com/file/d/')) {
            const match = screenshotUrl.match(/file\/d\/([^/]+)/);
            if (match && match[1]) {
                const fileId = match[1];
                screenshotUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            }
        }
        
        screenshotHtml = `
            <div class="mb-3">
                <h6>Screenshot:</h6>
                <div class="border rounded p-2 bg-light">
                    <a href="${escapeHTML(report.screenshotUrl)}" target="_blank" 
                       class="d-block text-center text-decoration-none">
                        <img src="${escapeHTML(screenshotUrl)}" 
                             alt="Screenshot" 
                             class="img-fluid rounded" 
                             style="max-height: 300px; max-width: 100%;"
                             onerror="this.onerror=null; this.src='https://placehold.co/600x400?text=Screenshot+Tidak+Tersedia';"
                             loading="lazy">
                        <div class="small text-muted mt-1">
                            Klik untuk lihat ukuran asli
                        </div>
                    </a>
                </div>
            </div>
        `;
    }
    
    const detailHtml = `
        <div class="row">
            <div class="col-md-6">
                <p><strong>Report ID:</strong> ${report.reportId}</p>
                <p><strong>Game:</strong> ${escapeHTML(report.gameName)}</p>
                <p><strong>Platform:</strong> ${report.platform}</p>
                <p><strong>Game ID:</strong> ${report.gameId}</p>
                <p><strong>Format:</strong> ${report.format}</p>
            </div>
            <div class="col-md-6">
                <p><strong>Reporter:</strong> ${escapeHTML(report.reporterName)}</p>
                <p><strong>Reporter ID:</strong> ${report.reporterId}</p>
                <p><strong>Tanggal Lapor:</strong> ${dateString}</p>
                <p><strong>Status:</strong> <span class="status-badge ${getStatusClass(report.status)}">${report.status}</span></p>
            </div>
        </div>
        
        <hr>
        
        <div class="mb-3">
            <h6>Detail Masalah:</h6>
            <div class="alert alert-light border">
                <p><strong>Jumlah Link Rusak:</strong> ${report.brokenLinksCount}</p>
                <p><strong>Cloud yang Rusak:</strong> ${report.brokenClouds}</p>
                <p><strong>Deskripsi:</strong></p>
                <p>${escapeHTML(report.description).replace(/\n/g, '<br>')}</p>
            </div>
        </div>
        
        ${screenshotHtml}
        
        ${report.adminNotes ? `
        <div class="mb-3">
            <h6>Catatan Admin:</h6>
            <div class="alert alert-info">
                ${escapeHTML(report.adminNotes).replace(/\n/g, '<br>')}
            </div>
        </div>
        ` : ''}
    `;
    
    document.getElementById('detailModalBody').innerHTML = detailHtml;
    
    // Set action buttons berdasarkan status
    const actionButtons = document.getElementById('actionButtons');
    if (report.status === 'pending' || report.status === 'processing') {
        actionButtons.innerHTML = `
            <button type="button" class="btn btn-warning" onclick="openUpdateStatusModal('${report.reportId}')">
                <i class="bi bi-pencil me-1"></i> Update Status
            </button>
        `;
    } else {
        actionButtons.innerHTML = `
            <button type="button" class="btn btn-warning" onclick="openUpdateStatusModal('${report.reportId}')">
                <i class="bi bi-pencil me-1"></i> Ubah Status
            </button>
        `;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
    modal.show();
}
        
        // Fungsi untuk membuka modal update status
        function openUpdateStatusModal(reportId) {
            document.getElementById('currentReportId').value = reportId;
            
            const modal = new bootstrap.Modal(document.getElementById('updateStatusModal'));
            modal.show();
        }
        
        // Fungsi untuk menyimpan update status
        async function saveStatusUpdate() {
            const reportId = document.getElementById('currentReportId').value;
            const newStatus = document.getElementById('newStatus').value;
            const adminNotes = document.getElementById('adminNotes').value;
            
            try {
                const response = await fetch(REPORT_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: `action=updateReportStatus&reportId=${encodeURIComponent(reportId)}` +
                          `&status=${encodeURIComponent(newStatus)}` +
                          `&adminNotes=${encodeURIComponent(adminNotes)}`
                });
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const result = await response.json();
                if (result.status === 'success') {
                    // Refresh laporan
                    await loadReports();
                    
                    // Tutup modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('updateStatusModal'));
                    if (modal) modal.hide();
                    
                    // Tutup detail modal jika terbuka
                    const detailModal = bootstrap.Modal.getInstance(document.getElementById('detailModal'));
                    if (detailModal) detailModal.hide();
                    
                    alert('Status berhasil diperbarui!');
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert('Gagal update status: ' + error.message);
            }
        }
        
        // Fungsi untuk export ke Excel
        function exportToExcel() {
            const csvContent = "data:text/csv;charset=utf-8," 
                + "Report ID,Game Name,Platform,Format,Broken Links,Broken Clouds,Description,Reporter,Status,Date\n"
                + allReports.map(report => 
                    `"${report.reportId}","${report.gameName}","${report.platform}","${report.format}",` +
                    `"${report.brokenLinksCount}","${report.brokenClouds}","${report.description}",` +
                    `"${report.reporterName}","${report.status}","${new Date(report.timestamp).toLocaleDateString()}"`
                ).join("\n");
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `laporan_user_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Helper functions
        function getStatusClass(status) {
            switch(status) {
                case 'pending': return 'status-pending';
                case 'processing': return 'status-processing';
                case 'resolved': return 'status-resolved';
                case 'rejected': return 'status-rejected';
                default: return '';
            }
        }
        
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function refreshReports() {
            loadReports();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadReports();
            
            // Set default dates
            const today = new Date().toISOString().split('T')[0];
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            const weekAgoStr = weekAgo.toISOString().split('T')[0];
            
            document.getElementById('filterDateTo').value = today;
            document.getElementById('filterDateFrom').value = weekAgoStr;
        });
    </script>
</body>
</html>
