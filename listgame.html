<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List Game A-Z INDapk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== GLOBAL THEME ===== */
    :root{
      --bg-dark:#0a0e1a;
      --bg-darker:#050812;
      --card-bg:rgba(255,255,255,.03);
      --text:#fff;
      --text-muted:rgba(255,255,255,.6);
      --neon-cyan:#00f0ff;
      --neon-purple:#b537f2;
      --neon-pink:#ff2e97;
      --glass-blur:blur(20px);
      --transition-smooth:all .4s cubic-bezier(.4,0,.2,1);
      
      /* Platform Colors */
      --ps1-color:#8a2be2; --ps2-color:#0066cc; --ps3-color:#00439c; --ps4-color:#0070cc;
      --psp-color:#8b4513; --psvita-color:#003791; --switch-color:#e60012; --wii-color:#009ac7;
      --gamecube-color:#6a5acd; --n3ds-color:#d12229; --android-color:#3ddc84;
      --ios-color:#0a84ff; --java-color:#f89820; --pc-color:#00a4ef; --apksgi-color:#ff2e97;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(181,55,242,.15),transparent),
                 radial-gradient(ellipse 60% 50% at 0% 100%,rgba(0,240,255,.1),transparent),
                 radial-gradient(ellipse 60% 50% at 100% 100%,rgba(255,46,151,.1),transparent),
                 linear-gradient(180deg,var(--bg-darker) 0%,var(--bg-dark) 100%);
      color:var(--text);
      font-family:Inter,sans-serif;
      min-height:100vh;
    }

    /* Background Grid */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);
      background-size:50px 50px;
      pointer-events:none;
      z-index:0;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      background: rgba(10, 14, 26, 0.95) !important;
      backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar-brand {
      font-family: Orbitron, sans-serif;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 600; }
    .nav-link:hover { color: var(--neon-cyan) !important; background: rgba(0,240,255,0.1); }

    .dropdown-menu {
      background: rgba(10, 14, 26, 0.98);
      border: 1px solid rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .dropdown-item { color: rgba(255,255,255,0.9); border-radius: 10px; padding: 8px 16px; }
    .dropdown-item:hover { background: rgba(0,240,255,0.2); color: var(--neon-cyan); }
    .dropdown-item .badge { width: 60px; }

    /* ===== HEADER ===== */
    .page-header {
      padding: 40px 0 20px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .page-header h1 {
      font-family: Orbitron, sans-serif;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    /* ===== SEARCH SECTION ===== */
    .search-section {
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,240,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 15px 50px 15px 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(0,240,255,0.3);
      border-radius: 50px;
      color: white;
      font-size: 16px;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
      background: rgba(0,0,0,0.7);
    }

    .search-input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .search-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition-smooth);
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 0 20px rgba(0,240,255,0.5);
    }

    .search-results-info {
      margin-top: 15px;
      padding: 10px 20px;
      background: rgba(0,240,255,0.1);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--neon-cyan);
    }

    .clear-search {
      color: var(--neon-pink);
      text-decoration: none;
      padding: 5px 15px;
      border-radius: 20px;
      border: 1px solid var(--neon-pink);
      transition: var(--transition-smooth);
    }

    .clear-search:hover {
      background: rgba(255,46,151,0.2);
      color: white;
    }

    /* ===== LOADING ANIMATIONS ===== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-darker);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      backdrop-filter: blur(10px);
    }

    .loading-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loading-container {
      text-align: center;
      position: relative;
    }

    .loading-controller {
      font-size: 80px;
      color: var(--neon-cyan);
      animation: controllerShake 1.5s infinite ease-in-out;
      text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
      margin-bottom: 20px;
    }

    @keyframes controllerShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(15deg) scale(1.1); }
      75% { transform: rotate(-15deg) scale(1.1); }
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    .loading-progress {
      width: 300px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 20px auto;
      position: relative;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      border-radius: 10px;
      animation: loadingProgress 2s infinite ease-in-out;
      box-shadow: 0 0 20px var(--neon-cyan);
    }

    @keyframes loadingProgress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    .platform-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      margin: 20px 0;
    }

    .platform-loading .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0,240,255,0.1);
      border-top: 4px solid var(--neon-cyan);
      border-right: 4px solid var(--neon-purple);
      border-bottom: 4px solid var(--neon-pink);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      margin-bottom: 20px;
    }
    .platform-loading .spinner-pulse {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, var(--neon-cyan) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .loading-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .loading-dot {
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      border-radius: 50%;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
      background: var(--neon-purple);
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
      background: var(--neon-pink);
    }
    .skeleton-loader {
      background: linear-gradient(90deg, 
        rgba(255,255,255,0.05) 25%, 
        rgba(0,240,255,0.1) 50%, 
        rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: skeleton 1.5s infinite;
    }

    @keyframes skeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    /* ===== SIMPLE PLATFORM LOADING ===== */
    .simple-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      margin: 30px 0;
      backdrop-filter: blur(5px);
    }

    .simple-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0,240,255,0.1);
      border-top: 4px solid var(--neon-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .simple-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--neon-cyan);
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0,240,255,0.5);
    }

    .simple-dots {
      display: flex;
      gap: 8px;
    }

    .simple-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      animation: simplePulse 1.5s infinite;
    }

    .simple-dot:nth-child(2) {
      animation-delay: 0.2s;
      background: var(--neon-purple);
    }

    .simple-dot:nth-child(3) {
      animation-delay: 0.4s;
      background: var(--neon-pink);
    }

    @keyframes simplePulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Platform Card Loading State */
    .platform-card.loading {
      pointer-events: none;
      opacity: 0.7;
      animation: cardPulse 1.5s infinite;
    }

    @keyframes cardPulse {
      0%, 100% { border-color: rgba(0,240,255,0.2); }
      50% { border-color: rgba(0,240,255,0.8); box-shadow: 0 0 20px rgba(0,240,255,0.3); }
    }

    /* ===== PLATFORM GRID ===== */
    .platform-grid-section {
      padding: 30px 0 40px;
      position: relative;
      z-index: 10;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .platform-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,240,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px 15px;
      text-align: center;
      transition: var(--transition-smooth);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .platform-card:hover {
      transform: translateY(-10px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
    }

    .platform-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: rgba(255,255,255,0.05);
    }

    .platform-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .game-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Platform Specific Colors */
    .platform-card[data-platform="ps1"] .platform-icon { background: rgba(138,43,226,0.2); color: #8a2be2; }
    .platform-card[data-platform="ps2"] .platform-icon { background: rgba(0,102,204,0.2); color: #0066cc; }
    .platform-card[data-platform="psvita"] .platform-icon { background: rgba(0,55,145,0.2); color: #003791; }
    .platform-card[data-platform="switch"] .platform-icon { background: rgba(230,0,18,0.2); color: #e60012; }

    /* ===== GAME LIST SECTION ===== */
    .game-list-section {
      padding: 30px 0;
      position: relative;
      z-index: 10;
    }

    .platform-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0,240,255,0.3);
    }

    .back-button {
      background: rgba(0,240,255,0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    .back-button:hover {
      background: rgba(0,240,255,0.2);
      color: white;
    }

    .alphabet-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(255,255,255,0.02);
      border-radius: 15px;
      justify-content: center;
    }

    .alphabet-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(0,240,255,0.3);
      background: transparent;
      color: var(--text);
      font-weight: 600;
      transition: var(--transition-smooth);
    }

    .alphabet-btn:hover,
    .alphabet-btn.active {
      background: var(--neon-cyan);
      border-color: var(--neon-cyan);
      color: black;
      box-shadow: 0 0 20px rgba(0,240,255,0.5);
    }

    .game-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(0,240,255,0.1);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      transition: var(--transition-smooth);
    }

    .game-title {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .game-title:hover {
      color: var(--neon-cyan);
    }
    
    .game-meta {
      display: flex;
      gap: 15px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      color: var(--text-muted);
    }

    .highlight {
      background: linear-gradient(120deg, rgba(0,240,255,0.3) 0%, rgba(181,55,242,0.3) 100%);
      padding: 0 2px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* ===== FOOTER ===== */
    .site-footer {
      background: rgba(5, 8, 18, 0.95);
      backdrop-filter: var(--glass-blur);
      padding: 30px 0;
      margin-top: 50px;
      border-top: 1px solid rgba(0,240,255,0.15);
    }

    .footer-brand {
      font-family: Orbitron, sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .site-footer a {
      transition: var(--transition-smooth);
    }
    
    .site-footer a:hover {
      color: var(--neon-cyan) !important;
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== KONFIGURASI API =====
    const API_CONFIGS = [
      { platform: 'ps1', name: 'PlayStation 1', icon: 'bi-playstation', url: 'https://script.google.com/macros/s/AKfycbxExg-rUr-CcJUYZ786k57e5E7JO2mSrGdRppr6JWbb7fHoTTAJs7x7AnYEmcOOK-49/exec' },
      { platform: 'ps2', name: 'PlayStation 2', icon: 'bi-playstation', url: 'https://script.google.com/macros/s/AKfycbwvTmKNFx0rxWjAAlTpQk9h0hnFD-GcKZcUG4g3MtHFJLnw86lPGqgSoQuuVUJDe1xy/exec' },
      { platform: 'ps3', name: 'PlayStation 3', icon: 'bi-playstation', url: 'https://script.google.com/macros/s/AKfycbwqkrPhEvF3-_r1cu_wI7nRd56Z1AzNhank78R7dFgxHK57Wd2cf2WmV9ESXMAg_LHC/exec' },
      { platform: 'ps4', name: 'PlayStation 4', icon: 'bi-playstation', url: 'https://script.google.com/macros/s/AKfycbwHLRSQiwAiqj-y2W4JA8QfD1oDA13BepnHQHqNjxWYLHJl4Z7IoKGkA12wN-nlOINEeQ/exec' },
      { platform: 'psp', name: 'PSP', icon: 'bi-phone', url: 'https://script.google.com/macros/s/AKfycbxCg1_l60T858d14WKA3N8c23VJ_YYj_XxX2H4Rqad1tSwaolutSrksSw9ippHu1QOA/exec' },
      { platform: 'psvita', name: 'PS Vita', icon: 'bi-phone', url: 'https://script.google.com/macros/s/AKfycbySh1tyONA4ib6wNwq6ZXoHKiMX1P4e0rZ-4IvMiZTEyjJ6XDm1hdPwakYcOeuWPE_IQg/exec' },
      { platform: 'switch', name: 'Nintendo Switch', icon: 'bi-nintendo-switch', url: 'https://script.google.com/macros/s/AKfycbytk1iwBYb2xGF2j3fjTmTFBNzQ_ifXsxrddlDWuPPNdMjWbHvyiRppEcoq0V1BGjn-/exec' },
      { platform: 'wii', name: 'Wii', icon: 'bi-controller', url: 'https://script.google.com/macros/s/AKfycbz8uhfQtYxyUmZSVloZlY0UDxkQayeYAemS6zDXS4zDKKJ-DYuq16pqFJLkNCYXg18a/exec' },
      { platform: 'gamecube', name: 'GameCube', icon: 'bi-controller', url: 'https://script.google.com/macros/s/AKfycbzN2P7leht4d5IM_zHmevEi4-jhqL_CjzHF31dlrSvR1osR1COe3oocfKR5PC86wE6Oig/exec' },
      { platform: '3ds', name: '3DS', icon: 'bi-laptop', url: 'https://script.google.com/macros/s/AKfycbwvTthKe_U-lCNxMu4c4WtuJbfp3Xzt8aWyAT10hFU1LXsKmsTidBoCnTQfShokliVq/exec' },
      { platform: 'android', name: 'Android', icon: 'bi-phone', url: 'https://script.google.com/macros/s/AKfycbwjF-qp6zHQGiBchoReCX3xLpWSLJysoUsRDDiXbm3nZ51RdaLWrpCh5jqno5A-Rmn4/exec' },
      { platform: 'ios', name: 'iOS', icon: 'bi-apple', url: 'https://script.google.com/macros/s/AKfycbxicykcCe_w26RZhwMf1o8oeTVz9aRFlhRjH1Aq_Em7KR5U-z31YzB8Co5KUhQYyqcDkw/exec' },
      { platform: 'java', name: 'Java', icon: 'bi-cup', url: 'https://script.google.com/macros/s/AKfycbwvmH1CO1HV10KB6jftoXqJGbjCQSqykEauZbFbitNFkrNaPnbFNw779kH7n9XZX7t3/exec' },
      { platform: 'pc', name: 'PC', icon: 'bi-pc', url: 'https://script.google.com/macros/s/AKfycbxKEqdp8W2YOvP-s11-Py8mmt-qBStCFr6pdnV2kjTCX3tDI04xBtlfH5XDE3ldx2Kd3Q/exec' },
      { platform: 'apksgi', name: 'APKsgi 18+', icon: 'bi-18-circle', url: 'https://script.google.com/macros/s/AKfycbw1-OmUFQ6awOwO4wCbKbvEqVqKQlVfixX7bY9mCL0LKDZ1yBAg2PVTA12WXoFz5f3C/exec' }
    ];

    // ===== GLOBAL STATE =====
    let currentPlatform = null;
    let gamesData = [];
    let filteredGames = [];
    let currentLetter = 'ALL';
    let currentSearchQuery = '';
    let platformCounts = {};

    // ===== HELPER FUNCTIONS =====
    function normalizeText(text) {
      return String(text || '').trim().toLowerCase();
    }

    function escapeHTML(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getPlatformColor(platform) {
      const colors = {
        'ps1': '#8a2be2', 'ps2': '#0066cc', 'ps3': '#00439c', 'ps4': '#0070cc',
        'psp': '#8b4513', 'psvita': '#003791', 'switch': '#e60012', 'wii': '#009ac7',
        'gamecube': '#6a5acd', '3ds': '#d12229', 'android': '#3ddc84',
        'ios': '#0a84ff', 'java': '#f89820', 'pc': '#00a4ef', 'apksgi': '#ff2e97'
      };
      return colors[platform] || '#00f0ff';
    }

    // ===== LOADING FUNCTIONS =====
    function showPageLoader() {
      const overlay = document.getElementById('pageLoadingOverlay');
      if (overlay) {
        overlay.style.display = 'flex';
        overlay.classList.remove('fade-out');
      }
    }

    function hidePageLoader() {
      const overlay = document.getElementById('pageLoadingOverlay');
      if (overlay) {
        overlay.classList.add('fade-out');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }
    }

    // ===== SIMPLE LOADING UNTUK PLATFORM =====
    function showSimplePlatformLoader(platformName) {
      const container = document.getElementById('gamesContainer');
      if (!container) return;
      
      container.innerHTML = `
        <div class="simple-loading">
          <div class="simple-spinner"></div>
          <div class="simple-text">Memuat ${platformName}</div>
          <div class="simple-dots">
            <div class="simple-dot"></div>
            <div class="simple-dot"></div>
            <div class="simple-dot"></div>
          </div>
          <p class="text-muted mt-3" style="font-size: 14px;">Mengambil data game dari server...</p>
        </div>
      `;
    }

    // ===== LOAD PLATFORM COUNTS =====
    async function loadAllPlatformCounts() {
      try {
        const promises = API_CONFIGS.map(async (cfg) => {
          try {
            const response = await fetch(cfg.url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: 'action=getAllGames'
            });
            const result = await response.json();
            if (result.status === 'success' && Array.isArray(result.data)) {
              platformCounts[cfg.platform] = result.data.length;
            }
          } catch (e) {
            platformCounts[cfg.platform] = 0;
          }
        });
        await Promise.allSettled(promises);
        renderPlatformGrid();
      } catch (error) {
        console.error('Error loading counts:', error);
      }
    }

    // ===== RENDER PLATFORM GRID =====
    function renderPlatformGrid() {
      const grid = document.getElementById('platformGrid');
      if (!grid) return;

      let html = '';
      API_CONFIGS.forEach(cfg => {
        const count = platformCounts[cfg.platform] || 0;
        html += `
          <a href="listgame.html#${cfg.platform}" class="platform-card" data-platform="${cfg.platform}">
            <div class="platform-icon">
              <i class="bi ${cfg.icon}"></i>
            </div>
            <div class="platform-name">${cfg.name}</div>
            <div class="game-count">${count.toLocaleString()} Game${count !== 1 ? 's' : ''}</div>
          </a>
        `;
      });
      grid.innerHTML = html;
    }

    // ===== FUNGSI SEARCH =====
    function initializeSearch() {
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      
      if (!searchInput || !searchBtn) return;

      // Fungsi untuk melakukan pencarian
      const performSearch = () => {
        const query = searchInput.value.trim();
        currentSearchQuery = query;
        
        if (query === '') {
          clearSearch();
          return;
        }

        filterGamesBySearch(query);
      };

      // Fungsi untuk menghapus pencarian
      const clearSearch = () => {
        searchInput.value = '';
        currentSearchQuery = '';
        document.getElementById('searchResultsInfo').style.display = 'none';
        filterGamesByLetter(currentLetter);
      };

      // Event listeners
      searchBtn.addEventListener('click', performSearch);
      
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          performSearch();
        }
      });

      clearSearchBtn.addEventListener('click', (e) => {
        e.preventDefault();
        clearSearch();
      });
    }

    // ===== FILTER GAMES BY SEARCH =====
    function filterGamesBySearch(query) {
      const searchTerm = normalizeText(query);
      
      // Tampilkan loading
      const container = document.getElementById('gamesContainer');
      container.innerHTML = `
        <div class="simple-loading" style="padding: 40px 20px;">
          <div class="simple-spinner" style="width: 35px; height: 35px;"></div>
          <div class="simple-text" style="font-size: 16px;">Mencari "${escapeHTML(query)}"...</div>
        </div>
      `;

      setTimeout(() => {
        // Filter berdasarkan huruf yang dipilih dulu, lalu search
        let gamesToSearch = gamesData;
        
        if (currentLetter !== 'ALL') {
          if (currentLetter === '#') {
            gamesToSearch = gamesData.filter(game => {
              const firstChar = (game.nama_game || '').trim().charAt(0);
              return /[0-9]/.test(firstChar);
            });
          } else {
            gamesToSearch = gamesData.filter(game => {
              const firstChar = (game.nama_game || '').trim().charAt(0).toUpperCase();
              return firstChar === currentLetter;
            });
          }
        }

        // Lakukan pencarian
        filteredGames = gamesToSearch.filter(game => {
          const gameName = normalizeText(game.nama_game || '');
          const category = normalizeText(game.category || '');
          const language = normalizeText(game.language || '');
          const region = normalizeText(game.region || '');
          
          return gameName.includes(searchTerm) || 
                 category.includes(searchTerm) || 
                 language.includes(searchTerm) || 
                 region.includes(searchTerm);
        });

        // Update info hasil pencarian
        const searchResultsInfo = document.getElementById('searchResultsInfo');
        const searchResultText = document.getElementById('searchResultText');
        
        if (currentSearchQuery) {
          searchResultsInfo.style.display = 'flex';
          searchResultText.innerHTML = `
            <i class="bi bi-search me-2"></i>
            Menampilkan <strong>${filteredGames.length}</strong> hasil pencarian untuk "${escapeHTML(currentSearchQuery)}"
            ${currentLetter !== 'ALL' ? ` (filter huruf: ${currentLetter})` : ''}
          `;
        }

        renderGameList(true); // true = highlight search query
      }, 300);
    }

    // ===== LOAD GAMES BY PLATFORM =====
    async function loadGamesByPlatform(platform) {
      const cfg = API_CONFIGS.find(p => p.platform === platform);
      if (!cfg) return;

      currentPlatform = platform;
      
      // Reset search state
      currentSearchQuery = '';
      document.getElementById('searchResultsInfo').style.display = 'none';
      document.getElementById('searchInput').value = '';
      
      // Tampilkan loading sederhana
      showSimplePlatformLoader(cfg.name);

      try {
        const response = await fetch(cfg.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'action=getAllGames'
        });
        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data)) {
          gamesData = result.data.map(game => ({
            ...game,
            nama_game: game.nama_game || game.ori_name || 'Unknown Game',
            __sortTitle: (game.nama_game || game.ori_name || '').trim()
          })).sort((a, b) => a.__sortTitle.localeCompare(b.__sortTitle, 'id'));

          filteredGames = [...gamesData];
          renderPlatformInfo(cfg);
          renderAlphabetFilter();
          filterGamesByLetter('ALL');
        } else {
          throw new Error('Invalid data format');
        }
      } catch (error) {
        console.error('Error loading games:', error);
        document.getElementById('gamesContainer').innerHTML = `
          <div class="empty-state">
            <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: var(--neon-pink);"></i>
            <h5 class="mt-3" style="color: var(--neon-pink);">Gagal Memuat Data</h5>
            <p class="text-muted">Silakan coba lagi nanti</p>
            <button onclick="location.reload()" class="btn btn-outline-info mt-3">
              <i class="bi bi-arrow-repeat me-2"></i>Muat Ulang
            </button>
          </div>
        `;
      }
    }

    // ===== RENDER PLATFORM INFO =====
    function renderPlatformInfo(cfg) {
      document.getElementById('platformSelection').style.display = 'none';
      document.getElementById('gameListContent').style.display = 'block';
      document.getElementById('selectedPlatformTitle').innerHTML = `<i class="bi ${cfg.icon} me-2"></i>${cfg.name}`;
      document.getElementById('selectedPlatformCount').textContent = `${gamesData.length} Game${gamesData.length !== 1 ? 's' : ''}`;
    }

    // ===== RENDER ALPHABET FILTER =====
    function renderAlphabetFilter() {
      const alphabet = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const container = document.getElementById('alphabetFilter');
      
      let html = '<button class="alphabet-btn active" data-letter="ALL">ALL</button>';
      alphabet.forEach(letter => {
        if (letter === '#') {
          html += `<button class="alphabet-btn" data-letter="#">#</button>`;
        } else {
          html += `<button class="alphabet-btn" data-letter="${letter}">${letter}</button>`;
        }
      });

      container.innerHTML = html;

      // Event listeners
      container.querySelectorAll('.alphabet-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          container.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const letter = this.dataset.letter;
          currentLetter = letter;
          
          // Jika sedang dalam mode search, update search dengan filter baru
          if (currentSearchQuery) {
            filterGamesBySearch(currentSearchQuery);
          } else {
            filterGamesByLetter(letter);
          }
        });
      });
    }

    // ===== FILTER GAMES BY LETTER =====
    function filterGamesByLetter(letter) {
      // Loading sederhana untuk filter
      const container = document.getElementById('gamesContainer');
      container.innerHTML = `
        <div class="simple-loading" style="padding: 40px 20px;">
          <div class="simple-spinner" style="width: 35px; height: 35px;"></div>
          <div class="simple-text" style="font-size: 16px;">Memfilter game...</div>
        </div>
      `;

      setTimeout(() => {
        if (letter === 'ALL') {
          filteredGames = [...gamesData];
        } else if (letter === '#') {
          filteredGames = gamesData.filter(game => {
            const firstChar = (game.nama_game || '').trim().charAt(0);
            return /[0-9]/.test(firstChar);
          });
        } else {
          filteredGames = gamesData.filter(game => {
            const firstChar = (game.nama_game || '').trim().charAt(0).toUpperCase();
            return firstChar === letter;
          });
        }

        renderGameList(false);
      }, 300);
    }

    // ===== RENDER GAME LIST DENGAN HIGHLIGHT SEARCH =====
    function renderGameList(highlightSearch = false) {
      const container = document.getElementById('gamesContainer');

      if (filteredGames.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-emoji-frown" style="font-size: 3rem;"></i>
            <h5 class="mt-3">Tidak Ada Game</h5>
            <p class="text-muted">
              ${currentSearchQuery ? 
                `Tidak ditemukan game dengan kata "${escapeHTML(currentSearchQuery)}"` : 
                `Tidak ditemukan game dengan huruf "${currentLetter}"`}
            </p>
          </div>
        `;
        return;
      }

      let html = `<p class="mb-3 text-muted">Menampilkan ${filteredGames.length} game</p>`;

      filteredGames.forEach((game, index) => {
        let gameName = game.nama_game || 'Unknown Game';
        
        // Highlight search query jika diperlukan
        if (highlightSearch && currentSearchQuery) {
          const regex = new RegExp(`(${currentSearchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          gameName = gameName.replace(regex, '<span class="highlight">$1</span>');
        }
        
        const platformColor = getPlatformColor(currentPlatform);
        const downloadUrl = `download.html?game=${game.download_id}&platform=${currentPlatform}`;

        html += `
          <div class="game-item" style="border-left: 4px solid ${platformColor};">
            <div class="row align-items-center">
              <div class="col-md-8">
                <div class="d-flex align-items-center gap-3">
                  <span class="badge bg-secondary" style="background: ${platformColor}80 !important;">${(index + 1).toString().padStart(3, '0')}</span>
                  <div>
                    <a href="${downloadUrl}" class="game-title" target="_blank">${gameName}</a>
                    <div class="game-meta">
                      ${game.category ? `<span><i class="bi bi-tag me-1"></i>${escapeHTML(game.category)}</span>` : ''}
                      ${game.language ? `<span><i class="bi bi-translate me-1"></i>${escapeHTML(game.language)}</span>` : ''}
                      ${game.region ? `<span><i class="bi bi-globe me-1"></i>${escapeHTML(game.region)}</span>` : ''}
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-4 text-md-end mt-2 mt-md-0">
                <a href="${downloadUrl}" class="btn btn-sm btn-outline-primary" target="_blank">
                  <i class="bi bi-download me-1"></i> Download
                </a>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ===== INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('yearNow').textContent = new Date().getFullYear();
      
      // Show page loader
      showPageLoader();

      // Inisialisasi search
      initializeSearch();

      // Cek hash URL
      const hash = window.location.hash.replace('#', '').trim().toLowerCase();

      if (hash) {
        const validPlatform = API_CONFIGS.some(cfg => cfg.platform === hash);
        if (validPlatform) {
          await loadAllPlatformCounts();
          await loadGamesByPlatform(hash);
        } else {
          // Hash tidak valid, tampilkan platform grid
          await loadAllPlatformCounts();
        }
      } else {
        // Tidak ada hash, tampilkan platform grid
        await loadAllPlatformCounts();
      }

      // Hide page loader setelah semuanya selesai
      setTimeout(hidePageLoader, 1000);

      // Listen for hash changes
      window.addEventListener('hashchange', async function() {
        const newHash = window.location.hash.replace('#', '').trim().toLowerCase();
        if (newHash) {
          const validPlatform = API_CONFIGS.some(cfg => cfg.platform === newHash);
          if (validPlatform) {
            document.getElementById('platformSelection').style.display = 'none';
            await loadGamesByPlatform(newHash);
          }
        } else {
          // Back to platform selection
          document.getElementById('platformSelection').style.display = 'block';
          document.getElementById('gameListContent').style.display = 'none';
          currentPlatform = null;
          await loadAllPlatformCounts();
        }
      });
    });

    // Intercept klik pada platform card
    document.addEventListener('click', function(e) {
      const platformCard = e.target.closest('.platform-card');
      if (platformCard) {
        const platform = platformCard.dataset.platform;
        const platformName = platformCard.querySelector('.platform-name').textContent;
        
        // Tampilkan loading sederhana sebelum hash change
        document.getElementById('platformSelection').style.display = 'none';
        document.getElementById('gameListContent').style.display = 'block';
        showSimplePlatformLoader(platformName);
      }
    });
  </script>
</body>
</html>
